[project]
name = "ml-advisor"
version = "0.1.0"
description = "Biblioteca modular para análise exploratória, testes de hipóteses e recomendação de ML com LLMs locais."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "scipy>=1.18.1",
    "scikit-learn>=1.9.1",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ml_advisor"]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "flake8>=7.3.0",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "respx>=0.23.1",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[project.scripts]
ollama-control = "ml_advisor.utils.ollama_control:main"
